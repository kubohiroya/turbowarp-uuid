name: Deploy documentation to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify CI for the main commit
        id: verified
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.head_sha : context.sha;
            const {owner, repo} = context.repo;
            const branch = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            if (branch.data.commit.sha !== sha) {
              throw new Error('Refusing to deploy a commit that is not the main branch tip.');
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'ci.yml', head_sha: sha,
              branch: 'main', event: 'push', status: 'completed', per_page: 100
            });
            if (!runs.some(run => run.head_sha === sha && run.conclusion === 'success')) {
              throw new Error('The main commit must pass CI before Pages publication.');
            }
            core.setOutput('sha', sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.verified.outputs.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify samples and prepare site
        run: node scripts/prepare-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
